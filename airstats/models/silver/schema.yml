version: 2

models:
  - name: silver_airports
    description: '{{ doc("silver_airports") }}'
    columns:
      - name: airport_ident
        description: "Unique identifier for the airport"
        data_tests:
          - unique
          - not_null

      - name: airport_type
        description: '{{ doc("airport_type") }}'
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values:
                  - small_airport
                  - medium_airport
                  - large_airport
                  - heliport
                  - seaplane_base
                  - balloonport
                  - closed

      - name: airport_name
        description: "Name of the airport"
        data_tests:
          - not_null

      - name: airport_lat
        description: "Latitude coordinate"
        data_tests:
          - dbt_expectations.expect_column_values_to_be_between:
              arguments:
                min_value: -90
                max_value: 90
      - name: airport_long
        description: "Longitude coordinate"
        data_tests:
          - dbt_expectations.expect_column_values_to_be_between:
              arguments:
                min_value: -180
                max_value: 180
      - name: continent
        description: "Continent"

      - name: iso_country
        description: "Country code"

      - name: iso_region
        description: "Region code"

  - name: silver_runways
    description: "Runways"
    columns:
      - name: runway_id
        description: "Unique identifier for the runway"
        data_tests:
          - unique
          - not_null

      - name: airport_ident
        description: "Reference to the parent airport"
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('silver_airports')
                field: airport_ident
              config:
                severity: warn
      - name: runway_length_ft
        description: "Length of the runway"

      - name: runway_width_ft
        description: "Width of the runway"

      - name: runway_surface
        description: "Surface material of the runway.Unknown values are marked as __UNKNOWN__"
        data_tests:
          - not_null

      - name: runway_lighted
        description: "Whether the runway has lighting"

      - name: runway_closed
        description: "Whether the runway is closed"

  - name: silver_airport_comments
    description: "Submitted comments about airports"
    columns:
      - name: comment_id
        description: "Unique identifier for the comment"
        data_tests:
          - unique
          - not_null

      - name: airport_ident
        description: "Reference to the airport"
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('silver_airports')
                field: airport_ident
              config:
                severity: warn
      - name: comment_timestamp
        description: "When the comment was posted"
        data_tests:
          - dbt_expectations.expect_column_values_to_be_of_type:
              arguments:
                column_type: timestamp_ntz
      - name: member_nickname
        description: "Username of the commenter. Unknown users are marked as __UNKNOWN__"

      - name: comment_subject
        description: "Subject line of the comment"

      - name: comment_body
        description: "Full text of the comment"
        data_tests:
          - not_null

      - name: loaded_at
        description: "Timestamp when the record was loaded"